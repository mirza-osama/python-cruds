{% extends 'base.html' %}

{% block content %}

<h2>Student Details</h2>

<table class="table table-bordered">

<tr>
    <th>Name</th>
    <td>{{ student.name }}</td>
</tr>

<tr>
    <th>Age</th>
    <td>{{ student.age }}</td>
</tr>

<tr>
    <th>Class</th>
    <td>{{ student.student_class }}</td>
</tr>

</table>

<a href="/students" class="btn btn-secondary">
Back
</a>

{% endblock %}
