{% extends 'base.html' %}

{% block content %}

<h2>Edit Student</h2>

<form method="POST">

    <input
        type="text"
        name="name"
        value="{{ student.name }}"
        class="form-control mb-2"
    >

    <input
        type="number"
        name="age"
        value="{{ student.age }}"
        class="form-control mb-2"
    >

    <input
        type="text"
        name="student_class"
        value="{{ student.student_class }}"
        class="form-control mb-2"
    >

    <button class="btn btn-warning">
        Update
    </button>

</form>

{% endblock %}
