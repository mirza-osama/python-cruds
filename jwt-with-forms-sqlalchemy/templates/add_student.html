{% extends 'base.html' %}

{% block content %}

<h2>Add Student</h2>

<form method="POST">

    <input
        type="text"
        name="name"
        placeholder="Name"
        class="form-control mb-2"
        required
    >

    <input
        type="number"
        name="age"
        placeholder="Age"
        class="form-control mb-2"
        required
    >

    <input
        type="text"
        name="student_class"
        placeholder="Class"
        class="form-control mb-2"
        required
    >

    <button class="btn btn-success">
        Save
    </button>

</form>

{% endblock %}
